<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Panel Access</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: #05010a;
    color: #fff;
    overflow: hidden;
}

/* ===== CANVAS ===== */
#bg {
    position: fixed;
    inset: 0;
    z-index: 0;
}

/* ===== BOOT SCREEN ===== */
#boot {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
    color: #c77dff;
    text-align: center;
}

.boot-text {
    font-size: 14px;
    opacity: 0.8;
    margin: 5px;
}

/* ===== MAIN PANEL ===== */
#app {
    display: none;
    position: relative;
    z-index: 2;
    padding: 20px;
    max-width: 1100px;
    margin: auto;
}

/* HEADER */
.header {
    text-align: center;
    margin-top: 20px;
}

.header h1 {
    color: #c77dff;
    text-shadow: 0 0 15px #7b2cbf;
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 20px;
}

.stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(199,125,255,0.2);
    padding: 12px;
    border-radius: 12px;
    text-align: center;
}

/* DATABASE */
.db {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.record {
    display: flex;
    justify-content: space-between;
    padding: 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(199,125,255,0.15);
    cursor: pointer;
    transition: 0.3s;
}

.record:hover {
    transform: translateX(5px);
    box-shadow: 0 0 20px rgba(199,125,255,0.3);
}

.role {
    color: #e0aaff;
    font-weight: bold;
}

/* SKILLS */
.skills {
    margin-top: 30px;
}

.bar {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
}

.fill {
    height: 100%;
    background: linear-gradient(90deg,#7b2cbf,#c77dff);
}

/* MODAL */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.box {
    background: #120022;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #7b2cbf;
    width: 90%;
    max-width: 500px;
}

.close {
    float: right;
    cursor: pointer;
    color: red;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<!-- BOOT -->
<div id="boot">
    <div class="boot-text">INITIALIZING STAFF DATABASE...</div>
    <div class="boot-text">LOADING EXPERIENCE LOGS...</div>
    <div class="boot-text">VERIFYING USER: HATE075</div>
    <div class="boot-text">ACCESS GRANTED</div>
</div>

<!-- APP -->
<div id="app">

<div class="header">
    <h1>STAFF DATABASE PANEL</h1>
    <p>HATE075 → HATE076</p>
</div>

<div class="stats">
    <div class="stat">Servers: 9+</div>
    <div class="stat">Experience: ~5 Years</div>
    <div class="stat">Rank Path: Helper → Co-Owner</div>
    <div class="stat">Status: Experienced</div>
</div>

<div class="db" id="db"></div>

<div class="skills">
    <h2>System Skills</h2>

    <p>Moderation</p>
    <div class="bar"><div class="fill" style="width:92%"></div></div>

    <p>Leadership</p>
    <div class="bar"><div class="fill" style="width:85%"></div></div>

    <p>Management</p>
    <div class="bar"><div class="fill" style="width:88%"></div></div>
</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="box">
        <span class="close" onclick="closeM()">X</span>
        <h2 id="t"></h2>
        <p id="i"></p>
        <p id="r"></p>
    </div>
</div>

<script>
const data = [
 {s:"NovaWorld",r:"SrMod",t:"1.5 anni",m:"Server closed"},
 {s:"LattinaCraft",r:"Co-Owner",t:"3 anni",m:"Server closed"},
 {s:"MiddleHeart",r:"Helper+",t:"4 mesi",m:"Personal reasons"},
 {s:"Emirates",r:"Staff Manager",t:"4 mesi",m:"Personal reasons"},
 {s:"FusionMc",r:"Helper",t:"24 giorni",m:"Leave"},
 {s:"Lyzard",r:"SrAdmin",t:"1 anno",m:"Depex"},
 {s:"AlphaNet",r:"SrMod",t:"4 mesi",m:"Closed"}
];

const db = document.getElementById("db");

function load(){
 data.forEach(d=>{
  let el = document.createElement("div");
  el.className="record";
  el.innerHTML = `<div><div class="role">${d.r}</div><div>${d.s}</div></div><div>${d.t}</div>`;
  el.onclick=()=>open(d);
  db.appendChild(el);
 });
}

function open(d){
 document.getElementById("modal").style.display="flex";
 document.getElementById("t").innerText=d.s+" - "+d.r;
 document.getElementById("i").innerText="Duration: "+d.t;
 document.getElementById("r").innerText="Reason: "+d.m;
}

function closeM(){
 document.getElementById("modal").style.display="none";
}

load();

/* BOOT */
setTimeout(()=>{
 document.getElementById("boot").style.display="none";
 document.getElementById("app").style.display="block";
},2500);

/* STARFIELD */
const c=document.getElementById("bg");
const x=c.getContext("2d");
c.width=window.innerWidth;
c.height=window.innerHeight;

let stars=[];
for(let i=0;i<120;i++){
 stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5});
}

function a(){
 x.clearRect(0,0,c.width,c.height);
 x.fillStyle="white";
 stars.forEach(s=>{
  s.y+=0.3;
  if(s.y>c.height) s.y=0;
  x.beginPath();
  x.arc(s.x,s.y,s.r,0,Math.PI*2);
  x.fill();
 });
 requestAnimationFrame(a);
}
a();
</script>

</body>
</html>
